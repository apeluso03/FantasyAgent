[project]
name = "fantasy-agent"
version = "0.1.0"
description = "AI agent for keeper/draft/trade decisions in a Sleeper fantasy football league"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "openai>=1.50",
    # Pinned below 2.0: the 2.x SDK changed the server API mcp_server.py uses.
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "bcrypt>=4.0",
]

[project.scripts]
fantasy-agent = "fantasy_agent.cli:app"
fantasy-agent-mcp = "fantasy_agent.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
