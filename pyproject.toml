[project]
name = "fantasy-agent"
version = "0.1.0"
description = "AI agent for keeper/draft/trade decisions in a Sleeper fantasy football league"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]
build = [
    "pyinstaller>=6.10",
    "pyinstaller-hooks-contrib>=2024.9",
]

[project.scripts]
fantasy-agent = "fantasy_agent.cli:app"
fantasy-agent-gui = "fantasy_agent.gui:main"
fantasy-agent-gui-user = "fantasy_agent.gui_user:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
