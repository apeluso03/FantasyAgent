# Local full-stack run against real Postgres (CLAUDE.md section 7.1) --
# `docker compose up`. The frontend still runs separately via `npm run dev`
# in frontend/ (Vite's dev server + HMR beats a built static container for
# day-to-day work); this is for exercising the backend against the same
# database engine production uses.
#
# Needs a .env in the repo root (see .env.example) for SLEEPER_LEAGUE_ID,
# SLEEPER_OWNER_USER_ID, and OPENAI_API_KEY -- DATABASE_URL and CORS_ORIGINS
# below are deliberately NOT read from it, so this always points at the
# containerized Postgres rather than whatever your .env has for local SQLite.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fantasy_agent
      POSTGRES_USER: fantasy_agent
      POSTGRES_PASSWORD: fantasy_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasy_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://fantasy_agent:fantasy_agent@db:5432/fantasy_agent
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
